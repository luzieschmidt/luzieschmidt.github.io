<html>
	<head>
		<title>
			class 13 demo

		</title>
		<!-- add meta tag to use vw and vh units -->
		<meta name="viewport" content="width=device-widht"/>
<!-- add link tag -->
		<link rel="stylesheet" href="style.css"/>
	</head>

	<body>
		
		<p>
			this is a paragraph
		</p>

		<p>
			this is a second paragraph witht he same style
		</p>

		<!--ADD A TAG WITH A CLASS ATRIBUTE
		CLASS NAMES CANNOT HAVE SPACES
		AN Y CLASS ATRRIBUE WITH SPACES WILL COUNT AS MULPTIPLE CLASS NAMES -->

		<p class="blue">
			this is a blue paragraph
		</p>
		<h1 class="blue">
			this is a blue h1
		</h1>
		<!-- a generic inline group -->
		<span class="big purple">
			this is a big purple span
		</span>
		<span class="purple">
			this is a big purple span
		</span>
		<span class="big">
			this is a big purple span
		</span>

		<!-- you can only use a single id name ONCE -->
		<p id="important">
			this is important
			
		</p>
	</body>






</html>
